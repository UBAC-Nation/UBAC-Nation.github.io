<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title id="pageTitle">UBAC · Identidad Digital</title>
    <link rel="stylesheet" href="/uprise.css">
    <style>
        body { margin: 0; padding: 0; background: #e8e5df; }
        iframe { width: 100%; height: 100vh; border: none; display: block; }
        .cargando {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Georgia', serif;
            background: #fffef7;
            padding: 20px 40px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            z-index: 9999;
        }
    </style>
</head>
<body>
    <div id="cargando" class="cargando">Cargando UBAC...</div>
    <iframe id="contenidoFrame" src="" style="display:none;"></iframe>

    <script>
        let pathData = null;

        async function cargarPath() {
            const res = await fetch('/data/path.json');
            pathData = await res.json();
            
            // Cargar el script de la API dinámicamente
            if (pathData.api) {
                const script = document.createElement('script');
                script.src = pathData.api;
                document.head.appendChild(script);
            }
            
            manejarRuta();
        }

        function manejarRuta() {
            const rutaActual = window.location.pathname;
            const ruta = pathData.routes[rutaActual];

            if (ruta) {
                document.getElementById('pageTitle').textContent = ruta.title;
                const iframe = document.getElementById('contenidoFrame');
                const cargando = document.getElementById('cargando');
                
                iframe.src = ruta.path;
                iframe.onload = () => {
                    cargando.style.display = 'none';
                    iframe.style.display = 'block';
                };
            } else {
                document.getElementById('pageTitle').textContent = 'UBAC · 404';
                document.getElementById('contenidoFrame').src = '/404.html';
                document.getElementById('cargando').style.display = 'none';
                document.getElementById('contenidoFrame').style.display = 'block';
            }
        }

        window.addEventListener('popstate', manejarRuta);
        cargarPath();
    </script>
</body>
</html>
