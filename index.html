<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>UBAC - Plataforma Digital</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: #e8e5df;
            padding: 20px;
        }

        .dashboard {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        /* Perfil fijo visible siempre */
        .perfil {
            background: #1a1a2e;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .perfil-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            background: #e94560;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .menu-vertical a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .nav-bar {
            background: #f0f0f0;
            padding: 10px 20px;
            border-bottom: 1px solid #ddd;
        }

        .nav-bar a {
            margin-right: 20px;
            text-decoration: none;
            color: #1a1a2e;
            cursor: pointer;
        }

        .contenido-iframe {
            padding: 20px;
            min-height: 500px;
        }

        iframe {
            width: 100%;
            height: 600px;
            border: none;
            background: white;
        }

        footer {
            text-align: center;
            padding: 15px;
            background: #f9f9f9;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <!-- Perfil fijo (se ve siempre arriba) -->
        <div class="perfil">
            <div class="perfil-info">
                <div class="avatar">A</div>
                <div>
                    <strong>Ciudadano Anonimo</strong><br>
                    <small>ID: UBAC-2025-0001</small>
                </div>
            </div>
            <div class="menu-vertical">
                <a href="#" onclick="cargarPagina('perfil')">Mi Perfil</a>
                <a href="#" onclick="cargarPagina('config')">Configuracion</a>
                <a href="#" onclick="cerrarSesion()">Salir</a>
            </div>
        </div>

        <!-- Barra de navegacion -->
        <div class="nav-bar">
            <a onclick="cargarPagina('periodico')">Periodico</a>
            <a onclick="cargarPagina('propuestas')">Propuestas</a>
            <a onclick="cargarPagina('votaciones')">Votaciones</a>
            <a onclick="cargarPagina('ciudadanos')">Ciudadanos</a>
        </div>

        <!-- Contenido dinamico dentro de iframe -->
        <div class="contenido-iframe">
            <iframe id="contenidoFrame" src="pages/periodico.html"></iframe>
        </div>

        <footer>
            UBAC no tiene dueño. UBAC tiene ciudadanos.
        </footer>
    </div>

    <script>
        function cargarPagina(pagina) {
            const frame = document.getElementById('contenidoFrame');
            
            const paginas = {
                'periodico': 'pages/periodico.html',
                'propuestas': 'pages/propuestas.html',
                'votaciones': 'pages/votaciones.html',
                'ciudadanos': 'pages/ciudadanos.html',
                'perfil': 'pages/perfil.html',
                'config': 'pages/configuracion.html'
            };
            
            if (paginas[pagina]) {
                frame.src = paginas[pagina];
                
                // Simular cambio de URL sin recargar (opcional)
                const nuevaUrl = `#${pagina}`;
                window.location.hash = pagina;
            }
        }
        
        function cerrarSesion() {
            if (confirm('¿Cerrar sesion en UBAC?')) {
                window.location.href = 'login.html';
            }
        }
        
        // Cargar pagina segun el hash de la URL (ej: index.html#periodico)
        const hash = window.location.hash.substring(1);
        if (hash && ['periodico', 'propuestas', 'votaciones', 'ciudadanos', 'perfil', 'config'].includes(hash)) {
            cargarPagina(hash);
        } else {
            cargarPagina('periodico');
        }
        
        // Permitir navegacion con botones atras/adelante
        window.onhashchange = function() {
            const nuevaHash = window.location.hash.substring(1);
            if (nuevaHash) cargarPagina(nuevaHash);
        };
    </script>
</body>
</html>
