<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UBAC · Identidad Digital</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: #e8e5df;
            padding: 40px 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fffef7;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            font-size: 52px;
            font-weight: normal;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            font-family: inherit;
            font-size: 14px;
        }

        button {
            background: #1a1a2e;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1px;
        }

        button:hover {
            background: #16213e;
        }

        .mensaje {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .mensaje.error {
            color: #b33;
        }

        .mensaje.ok {
            color: #2e7d32;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>UBAC</h1>
        <div class="subtitle">Identidad Digital</div>

        <input type="text" id="nombre" placeholder="Nombre de usuario">
        <input type="email" id="email" placeholder="Correo electrónico">
        <input type="password" id="password" placeholder="Contraseña">
        <button onclick="registrar()">Crear Identidad</button>

        <div id="mensaje" class="mensaje"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

        let auth, db;

        async function cargarConfiguracion() {
            const respuesta = await fetch('config/firebase.json');
            const firebaseConfig = await respuesta.json();
            const app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        }

        function hashUBAC(texto) {
            let semilla = 0;
            for (let i = 0; i < texto.length; i++) semilla += texto.charCodeAt(i) * (i + 1);
            const rand = (function(seed) {
                let a = seed;
                return () => ((a = (a * 9301 + 49297) % 233280) / 233280);
            })(semilla);
            const tile = Array(6).fill().map(() => Array(6).fill(' '));
            for (let i = 0; i < 36; i++) {
                const f = Math.floor(i / 6), c = i % 6;
                tile[f][c] = texto[i % texto.length];
            }
            const mov = (texto.length % 5) + 1;
            for (let x = 0; x < mov; x++) {
                for (let f = 0; f < 6; f++) {
                    const p = Math.floor(rand() * 6);
                    [tile[f][p], tile[f][(p + 1) % 6]] = [tile[f][(p + 1) % 6], tile[f][p]];
                }
                for (let c = 0; c < 6; c++) {
                    const p = Math.floor(rand() * 6);
                    [tile[p][c], tile[(p + 1) % 6][c]] = [tile[(p + 1) % 6][c], tile[p][c]];
                }
            }
            const rev = Math.floor(semilla % 3) + 1;
            for (let f = 0; f < 6; f++) {
                for (let c = 0; c < 6; c++) {
                    if ((f + c) % rev === 0) tile[f][c] = String.fromCharCode((tile[f].join('').length % 26) + 65);
                }
            }
            let hash = tile.map(r => r.join('')).join('');
            let final = 0;
            for (let i = 0; i < hash.length; i++) final = (final * 31 + hash.charCodeAt(i)) % 0xFFFFFFFF;
            return final.toString(36).padStart(12, '0').slice(-12).toUpperCase();
        }

        async function nombreExiste(nombre) {
            const q = query(collection(db, 'identidades'), where('nombre', '==', nombre));
            const snapshot = await getDocs(q);
            return !snapshot.empty;
        }

        window.registrar = async () => {
            const nombre = document.getElementById('nombre').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const mensajeDiv = document.getElementById('mensaje');

            if (!nombre || !email || !password) {
                mensajeDiv.textContent = 'Completa todos los campos';
                mensajeDiv.className = 'mensaje error';
                return;
            }

            if (password.length < 6) {
                mensajeDiv.textContent = 'La contraseña debe tener al menos 6 caracteres';
                mensajeDiv.className = 'mensaje error';
                return;
            }

            try {
                const yaExiste = await nombreExiste(nombre);
                if (yaExiste) {
                    mensajeDiv.textContent = 'Este nombre de usuario ya está registrado, elige otro';
                    mensajeDiv.className = 'mensaje error';
                    return;
                }

                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                const id = 'UBAC-' + new Date().getFullYear() + '-' + Math.floor(Math.random() * 10000).toString().padStart(4, '0');
                const fecha = new Date().toISOString().split('T')[0];
                const secreto = 'ubac_secret_' + user.uid;
                const datosHash = `${id}|${nombre}|${email}|${fecha}|${secreto}`;
                const hash = hashUBAC(datosHash);

                await setDoc(doc(db, 'identidades', user.uid), {
                    uid: user.uid,
                    id: id,
                    nombre: nombre,
                    email: email,
                    fecha: fecha,
                    hash: hash,
                    creado: new Date().toISOString()
                });

                mensajeDiv.textContent = 'Identidad creada correctamente';
                mensajeDiv.className = 'mensaje ok';

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);

            } catch (error) {
                let errorMsg = 'Error al crear identidad';
                if (error.code === 'auth/email-already-in-use') errorMsg = 'El correo ya está registrado';
                if (error.code === 'auth/invalid-email') errorMsg = 'Correo inválido';
                mensajeDiv.textContent = errorMsg;
                mensajeDiv.className = 'mensaje error';
            }
        };

        cargarConfiguracion();
    </script>
</body>
</html>
