<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>UBAC - Registro de Ciudadano</title>
    <style>
        body { font-family: Arial; background: #e8e5df; padding: 40px; }
        .container { max-width: 400px; margin: auto; background: white; padding: 30px; border-radius: 8px; }
        input, button { width: 100%; margin: 10px 0; padding: 10px; }
        button { background: #1a1a2e; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📄 Registro en UBAC</h1>
        <input type="text" id="nombre" placeholder="Nombre de ciudadano (ej: ciudadano_anonimo)">
        <input type="text" id="nombreReal" placeholder="Nombre real (opcional)">
        <input type="email" id="email" placeholder="Correo electrónico">
        <button onclick="registrarCiudadano()">Registrarse</button>
        <div id="mensaje"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
        import { getAuth, signInWithPopup, GithubAuthProvider } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "ubac-nation.firebaseapp.com",
            projectId: "ubac-nation"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GithubAuthProvider();

        window.registrarCiudadano = async () => {
            const nombre = document.getElementById("nombre").value;
            const nombreReal = document.getElementById("nombreReal").value;
            const email = document.getElementById("email").value;

            if (!nombre) {
                document.getElementById("mensaje").innerHTML = "❌ El nombre de ciudadano es obligatorio";
                return;
            }

            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                const idNumber = `UBAC-${new Date().getFullYear()}-${Math.floor(Math.random() * 10000).toString().padStart(4, '0')}`;
                const datos = {
                    id: idNumber,
                    nombre: nombre,
                    nombreReal: nombreReal || "",
                    email: email,
                    uid: user.uid,
                    fechaEmision: new Date().toISOString().split('T')[0],
                    fechaExpiracion: new Date(Date.now() + 5 * 365 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
                    rol: "ciudadano"
                };

                // Aquí deberías llamar a VUB.create()
                const vubIdentidad = {
                    v: "VUB-25",
                    f: "ID",
                    d: "packed_data_placeholder",
                    h: "000000G5861U",
                    t: Date.now()
                };

                await setDoc(doc(db, "ciudadanos", user.uid), {
                    ...datos,
                    vub: vubIdentidad
                });

                document.getElementById("mensaje").innerHTML = `✅ Registrado como ${nombre} (${idNumber})`;
                setTimeout(() => window.location.href = "perfil.html", 2000);
            } catch (error) {
                document.getElementById("mensaje").innerHTML = `❌ Error: ${error.message}`;
            }
        };
    </script>
</body>
</html>
