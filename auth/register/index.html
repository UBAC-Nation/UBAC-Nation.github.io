<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UBAC - Unete a la identidad digital</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: #e8e5df;
            padding: 40px 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fffef7;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            font-size: 48px;
            font-weight: normal;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            font-family: inherit;
            font-size: 14px;
        }

        button {
            background: #1a1a2e;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #16213e;
        }

        .mensaje {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .mensaje.error {
            color: #b33;
        }

        .mensaje.ok {
            color: #2e7d32;
        }

        .hash {
            font-family: monospace;
            font-size: 11px;
            background: #f4f4f4;
            padding: 10px;
            margin-top: 20px;
            word-break: break-all;
            text-align: center;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>UBAC</h1>
        <div class="subtitle">Identidad digital · Unete</div>

        <input type="text" id="nombre" placeholder="Nombre de usuario">
        <input type="email" id="email" placeholder="Correo electronico">
        <button onclick="registrar()">Comenzar</button>

        <div id="mensaje" class="mensaje"></div>
        <div id="hashResultado" class="hash" style="display:none;"></div>
    </div>

    <script>
        function hashUBAC(texto) {
            let semilla = 0;
            for (let i = 0; i < texto.length; i++) semilla += texto.charCodeAt(i) * (i + 1);
            const rand = (function(seed) {
                let a = seed;
                return () => ((a = (a * 9301 + 49297) % 233280) / 233280);
            })(semilla);
            const tile = Array(6).fill().map(() => Array(6).fill(' '));
            for (let i = 0; i < 36; i++) {
                const f = Math.floor(i / 6), c = i % 6;
                tile[f][c] = texto[i % texto.length];
            }
            const mov = (texto.length % 5) + 1;
            for (let x = 0; x < mov; x++) {
                for (let f = 0; f < 6; f++) {
                    const p = Math.floor(rand() * 6);
                    [tile[f][p], tile[f][(p + 1) % 6]] = [tile[f][(p + 1) % 6], tile[f][p]];
                }
                for (let c = 0; c < 6; c++) {
                    const p = Math.floor(rand() * 6);
                    [tile[p][c], tile[(p + 1) % 6][c]] = [tile[(p + 1) % 6][c], tile[p][c]];
                }
            }
            const rev = Math.floor(semilla % 3) + 1;
            for (let f = 0; f < 6; f++) {
                for (let c = 0; c < 6; c++) {
                    if ((f + c) % rev === 0) tile[f][c] = String.fromCharCode((tile[f].join('').length % 26) + 65);
                }
            }
            let hash = tile.map(r => r.join('')).join('');
            let final = 0;
            for (let i = 0; i < hash.length; i++) final = (final * 31 + hash.charCodeAt(i)) % 0xFFFFFFFF;
            return final.toString(36).padStart(12, '0').slice(-12).toUpperCase();
        }

        window.registrar = () => {
            const nombre = document.getElementById('nombre').value.trim();
            const email = document.getElementById('email').value.trim();
            const mensajeDiv = document.getElementById('mensaje');
            const hashDiv = document.getElementById('hashResultado');

            if (!nombre || !email) {
                mensajeDiv.textContent = 'Completa ambos campos';
                mensajeDiv.className = 'mensaje error';
                return;
            }

            const id = 'UBAC-' + new Date().getFullYear() + '-' + Math.floor(Math.random() * 10000).toString().padStart(4, '0');
            const fecha = new Date().toISOString().split('T')[0];
            const secreto = 'clave_local_' + Math.random();

            const datos = `${id}|${nombre}|${email}|${fecha}|${secreto}`;
            const hash = hashUBAC(datos);

            localStorage.setItem('ubac_usuario', JSON.stringify({
                id: id,
                nombre: nombre,
                email: email,
                fecha: fecha,
                hash: hash
            }));

            mensajeDiv.textContent = 'Identidad creada correctamente';
            mensajeDiv.className = 'mensaje ok';
            hashDiv.style.display = 'block';
            hashDiv.innerHTML = 'Hash VUB: ' + hash + '<br>ID: ' + id;

            setTimeout(() => {
                window.location.href = '/';
            }, 1500);
        };
    </script>
</body>
</html>
